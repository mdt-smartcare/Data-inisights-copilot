# =============================================================================
# Default Filters - Applied automatically to queries
# =============================================================================
default_filters:
  patient_tracker_gold:
    filter: "is_deleted = false"
    description: "Exclude soft-deleted patients"
  
  patient_gold:
    filter: "res_deleted_at IS NULL"
    description: "Exclude deleted FHIR patient resources"
  
  bp_log_gold:
    filter: "is_src_deleted IS DISTINCT FROM 'true'"
    description: "Exclude deleted BP log entries (is_src_deleted is VARCHAR not boolean)"
  
  bp_log_latest_gold:
    filter: ""
    description: "Table is pre-filtered to contain only the latest BP reading per patient - no additional is_latest filter needed"

# =============================================================================
# Healthcare Metric Templates
# =============================================================================
metric_templates:
  # Blood Pressure Metrics
  hypertension_rate:
    expression: "COUNT(DISTINCT CASE WHEN avg_systolic >= 140 OR avg_diastolic >= 90 THEN patient_id END) * 100.0 / NULLIF(COUNT(DISTINCT patient_id), 0)"
    description: "Percentage of patients with hypertensive BP readings"
    tables: ["bp_log_latest_gold"]

  bp_control_rate:
    expression: "COUNT(DISTINCT CASE WHEN avg_systolic < 140 AND avg_diastolic < 90 THEN patient_id END) * 100.0 / NULLIF(COUNT(DISTINCT patient_id), 0)"
    description: "Percentage of patients with controlled blood pressure"
    tables: ["bp_log_latest_gold"]

  stage2_hypertension_rate:
    expression: "COUNT(DISTINCT CASE WHEN avg_systolic >= 160 OR avg_diastolic >= 100 THEN patient_id END) * 100.0 / NULLIF(COUNT(DISTINCT patient_id), 0)"
    description: "Percentage of patients with Stage 2 or higher hypertension"
    tables: ["bp_log_latest_gold"]

  # CVD Risk Metrics
  high_risk_rate:
    expression: "COUNT(DISTINCT CASE WHEN cvd_risk_level = 'High risk' THEN patient_id END) * 100.0 / NULLIF(COUNT(DISTINCT patient_id), 0)"
    description: "Percentage of patients classified as high CVD risk"
    tables: ["bp_log_latest_gold"]

  average_cvd_risk:
    expression: "AVG(cvd_risk_score)"
    description: "Average CVD risk score across patients"
    tables: ["bp_log_latest_gold"]

  # BMI/Obesity Metrics
  obesity_rate:
    expression: "COUNT(DISTINCT CASE WHEN bmi_category IN ('Obese', 'Extremely Obese') THEN patient_id END) * 100.0 / NULLIF(COUNT(DISTINCT patient_id), 0)"
    description: "Percentage of patients classified as obese"
    tables: ["bp_log_latest_gold"]

  average_bmi:
    expression: "AVG(bmi)"
    description: "Average BMI across patients"
    tables: ["bp_log_latest_gold"]

  # Program Metrics
  screening_rate:
    expression: "COUNT(DISTINCT CASE WHEN is_screening = true THEN patient_id END) * 100.0 / NULLIF(COUNT(DISTINCT patient_id), 0)"
    description: "Percentage of patients who completed screening"
    tables: ["patient_tracker_gold"]

  enrollment_rate:
    expression: "COUNT(DISTINCT CASE WHEN is_enrolled = true THEN patient_id END) * 100.0 / NULLIF(COUNT(DISTINCT CASE WHEN is_screening = true THEN patient_id END), 0)"
    description: "Percentage of screened patients who enrolled"
    tables: ["patient_tracker_gold"]

  diagnosis_rate:
    expression: "COUNT(DISTINCT CASE WHEN is_confirmed_diagnosis = true THEN patient_id END) * 100.0 / NULLIF(COUNT(DISTINCT CASE WHEN is_enrolled = true THEN patient_id END), 0)"
    description: "Percentage of enrolled patients with confirmed diagnosis"
    tables: ["patient_tracker_gold"]

  # Diabetes/Glucose Metrics (M&E)
  dm_control_rate:
    expression: "COUNT(DISTINCT CASE WHEN (glucose_type = 'Fasting' AND glucose_value < 126) OR (glucose_type = 'Random' AND glucose_value < 200) OR (hba1c IS NOT NULL AND hba1c < 7) THEN patient_id END) * 100.0 / NULLIF(COUNT(DISTINCT patient_id), 0)"
    description: "Percentage of diabetic patients with controlled blood sugar"
    tables: ["glucose_log_latest_gold"]

  elevated_bp_proportion:
    expression: "COUNT(DISTINCT CASE WHEN avg_systolic >= 140 OR avg_diastolic >= 90 THEN patient_id END) * 100.0 / NULLIF(COUNT(DISTINCT patient_id), 0)"
    description: "Proportion of screened individuals with elevated blood pressure"
    tables: ["bp_log_gold"]

  htn_dm_enrollment_breakdown:
    expression: |
      HTN only: COUNT(DISTINCT CASE WHEN is_htn_diagnosis = true AND (is_diabetes_diagnosis = false OR is_diabetes_diagnosis IS NULL) THEN patient_id END)
      DM only: COUNT(DISTINCT CASE WHEN is_diabetes_diagnosis = true AND (is_htn_diagnosis = false OR is_htn_diagnosis IS NULL) THEN patient_id END)
      Both: COUNT(DISTINCT CASE WHEN is_htn_diagnosis = true AND is_diabetes_diagnosis = true THEN patient_id END)
    description: "Breakdown of enrolled patients by condition type"
    tables: ["patient_tracker_gold"]
    tables: ["patient_tracker_gold"]

# =============================================================================
# Table Descriptions - Healthcare Context
# =============================================================================
table_descriptions:
  bp_log_latest_gold: "Blood pressure assessment records containing patient BP readings (3 measurements averaged), BMI, CVD risk levels, and clinical encounter information. Primary table for hypertension analytics."
  
  bp_log_gold: "Historical blood pressure measurements for longitudinal analysis and trend tracking."
  
  patient_tracker_gold: "Patient registry tracking enrollment status, screening completion, diagnosis confirmation, and program participation in the NCD/hypertension management program."
  
  patient_gold: "Core patient demographics from FHIR Patient resource. Uses res_id as identifier (no patient_id column)."
  
  patient_visit_gold: "Clinical visit records documenting patient encounters at health facilities."
  
  patient_diagnosis_gold: "Confirmed medical diagnoses for patients including ICD codes and diagnosis dates."
  
  patient_labtest_gold: "Laboratory test orders and requests for patients."
  
  patient_labtest_result_gold: "Laboratory test results including values and reference ranges."
  
  condition_gold: "FHIR Condition resources - diagnoses, problems, and health concerns."
  
  encounter_gold: "FHIR Encounter resources - clinical encounters and visits."
  
  appointment_gold: "FHIR Appointment resources - scheduled visits and appointments."
  
  organization_gold: "Healthcare organizations and implementing partners managing facilities."

# =============================================================================
# Column Semantics - Healthcare Data Dictionary
# =============================================================================
column_semantics:
  bp_log_latest_gold:
    res_id: "Unique identifier for this BP assessment record"
    encounter_id: "Links to the clinical encounter/visit"
    ymd: "Date of BP assessment (YYYY-MM-DD)"
    patient_id: "Unique patient identifier"
    avg_systolic: "Average of 3 systolic BP readings (mmHg) - key metric for hypertension"
    avg_diastolic: "Average of 3 diastolic BP readings (mmHg) - key metric for hypertension"
    avg_pulse: "Average heart rate (beats per minute)"
    systolic_1: "First systolic reading"
    systolic_2: "Second systolic reading"
    systolic_3: "Third systolic reading"
    diastolic_1: "First diastolic reading"
    diastolic_2: "Second diastolic reading"
    diastolic_3: "Third diastolic reading"
    bmi: "Body Mass Index calculated from height and weight"
    bmi_category: "WHO BMI classification (Underweight/Normal/Overweight/Obese/Extremely Obese)"
    cvd_risk_level: "Cardiovascular disease risk category (Low/Medium/High risk)"
    cvd_risk_score: "Numerical 10-year CVD risk percentage (0-100)"
    is_latest: "Boolean flag - TRUE means this is the patient's most recent assessment"
    is_before_htn_diagnosis: "Boolean flag - TRUE means reading was before hypertension diagnosis"
    encounter_type: "Service delivery point (Facility-based/Community Outreach)"
    assessment_category: "Purpose of visit (Screening/Follow-up/Referral)"
    organization_id: "Health facility unique identifier"
    height: "Patient height measurement"
    weight: "Patient weight measurement"
    bp_taken_on: "Timestamp when BP was measured"

  patient_tracker_gold:
    patient_id: "Unique patient identifier"
    is_deleted: "Soft-delete flag - exclude from queries"
    is_screening: "Whether patient completed initial screening"
    is_enrolled: "Whether patient is enrolled in NCD program"
    is_confirmed_diagnosis: "Whether patient has confirmed hypertension diagnosis"
    gender: "Patient gender (Male/Female)"
    age: "Patient age in years"
    cvd_risk_level: "Most recent CVD risk classification"
    created_at: "Date patient was registered"
    last_visit_date: "Date of most recent clinical visit"
    site_id: "Site/facility identifier (FK to site_gold)"
    country_id: "Country identifier"

# =============================================================================
# Validation Rules - Healthcare Data Governance
# =============================================================================
validation_rules:
  required_filters:
    - "Queries on patient_tracker_gold must include is_deleted = false"
    - "Use is_latest = true for current patient status, remove for trend analysis"
  
  column_type_warnings:
    - "bp_log_gold.is_src_deleted is VARCHAR not boolean - use IS DISTINCT FROM 'true' or COALESCE(..., 'false') != 'true'"
    - "patient_gold has NO patient_id column - use res_id instead"
  
  clinical_thresholds:
    - "Hypertension: systolic >= 140 OR diastolic >= 90"
    - "Stage 2 HTN: systolic >= 160 OR diastolic >= 100"
    - "Controlled BP: systolic < 140 AND diastolic < 90"
    - "Obesity: BMI >= 30"
    - "High CVD Risk: cvd_risk_level = 'High risk' OR cvd_risk_score >= 20"

  prohibited_operations:
    - "No DELETE, UPDATE, INSERT operations - read-only analytics"
    - "No access to PII beyond patient_id for analytics"
    - "No TRUNCATE, DROP, ALTER operations"

# =============================================================================
# Healthcare-Specific Query Patterns
# =============================================================================
query_patterns:
  bp_trend_over_time:
    description: "Track blood pressure trends over time periods"
    pattern: "SELECT DATE_TRUNC('month', ymd) as month, AVG(avg_systolic) as avg_systolic, AVG(avg_diastolic) as avg_diastolic FROM bp_log_latest_gold GROUP BY 1 ORDER BY 1"

  hypertension_by_facility:
    description: "Compare hypertension rates across facilities"
    pattern: "SELECT organization_id, COUNT(DISTINCT CASE WHEN avg_systolic >= 140 OR avg_diastolic >= 90 THEN patient_id END) * 100.0 / COUNT(DISTINCT patient_id) as htn_rate FROM bp_log_latest_gold GROUP BY organization_id"

  patient_risk_distribution:
    description: "Distribution of patients by CVD risk level"
    pattern: "SELECT cvd_risk_level, COUNT(DISTINCT patient_id) as patient_count FROM bp_log_latest_gold GROUP BY cvd_risk_level"

  bmi_category_breakdown:
    description: "Patient distribution by BMI category"
    pattern: "SELECT bmi_category, COUNT(DISTINCT patient_id) as count FROM bp_log_latest_gold GROUP BY bmi_category"

# =============================================================================
# M&E Join Patterns - Facility Hierarchy & Program Assignments
# =============================================================================
# These patterns are used by M&E teams to enrich clinical data with
# geographic hierarchy and program information for reporting dashboards.
# =============================================================================
me_join_patterns:
  # ===========================================================================
  # Facility Hierarchy CTE Pattern
  # ===========================================================================
  # Builds the complete facility hierarchy: Country → District/County → Chiefdom/Subcounty
  # Key join: health_facility_admin_gold.fhir_id → clinical_tables.organization_id
  # IMPORTANT: CAST fhir_id to BIGINT for integer comparison with organization_id
  # ===========================================================================
  facility_hierarchy:
    description: "CTE to build facility hierarchy from admin tables"
    tables:
      - health_facility_admin_gold
      - country_admin_gold
      - district_admin_gold
      - chiefdom_admin_gold
    join_keys:
      health_facility_to_country: "hf.country_id = co.id"
      health_facility_to_district: "hf.district_id = dis.id"
      health_facility_to_chiefdom: "hf.chiefdom_id = chif.id"
    output_columns:
      - "hf.id AS facility_id"
      - "hf.name AS facility_name"
      - "CAST(hf.fhir_id AS BIGINT) AS organization_id"
      - "co.name AS country"
      - "dis.name AS county_name"
      - "chif.name AS subcounty_name"
    filter: "hf.is_deleted = FALSE"
    pattern: |
      WITH facilities AS (
          SELECT
              hf.id AS facility_id,
              hf.name AS facility_name,
              CAST(hf.fhir_id AS BIGINT) AS organization_id,
              co.id AS country_id,
              co.name AS country,
              dis.id AS county_id,
              dis.name AS county_name,
              chif.id AS subcounty_id,
              chif.name AS subcounty_name
          FROM health_facility_admin_gold hf
          LEFT JOIN country_admin_gold co ON hf.country_id = co.id
          LEFT JOIN district_admin_gold dis ON hf.district_id = dis.id
          LEFT JOIN chiefdom_admin_gold chif ON hf.chiefdom_id = chif.id
          WHERE hf.is_deleted = FALSE
      )

  # ===========================================================================
  # Program Assignment CTE Pattern
  # ===========================================================================
  # Maps facilities to their assigned programs
  # Key join: health_facility_program_admin_gold → program_admin_gold
  # ===========================================================================
  facility_programs:
    description: "CTE to get program assignments for facilities"
    tables:
      - health_facility_program_admin_gold
      - program_admin_gold
    join_keys:
      program_to_facility: "pg.id = hfp.program_id"
    output_columns:
      - "hfp.health_facility_id AS facility_id"
      - "COALESCE(MAX(pg.name), 'Unassigned') AS program_name"
    pattern: |
      facility_programs AS (
          SELECT
              hfp.health_facility_id AS facility_id,
              COALESCE(MAX(pg.name), 'Unassigned') AS program_name
          FROM health_facility_program_admin_gold hfp
          LEFT JOIN program_admin_gold pg ON pg.id = hfp.program_id
          GROUP BY hfp.health_facility_id
      )

  # ===========================================================================
  # Clinical Data to Facility Join Pattern
  # ===========================================================================
  # How to join clinical tables (bp_log_gold, etc.) to facility hierarchy
  # ===========================================================================
  clinical_to_facility:
    description: "Join clinical data to facility hierarchy"
    join_key: "f.organization_id = bl.organization_id"
    note: "organization_id in clinical tables links to CAST(fhir_id AS BIGINT) in health_facility_admin_gold"

  # ===========================================================================
  # Glucose Log M&E Pattern
  # ===========================================================================
  # Same facility/program CTEs, different date field (bg_taken_on)
  # ===========================================================================
  glucose_log_me_pattern:
    description: "Complete M&E enrichment pattern for glucose log data"
    tables:
      - glucose_log_latest_gold
      - health_facility_admin_gold
      - country_admin_gold
      - district_admin_gold
      - chiefdom_admin_gold
      - health_facility_program_admin_gold
      - program_admin_gold
    date_field: "bg_taken_on"
    date_format_pattern: "date_format(TRY_CAST(gl.bg_taken_on AS DATE), '%Y-%m-%d')"
    ymd_pattern: "CAST(date_format(TRY_CAST(gl.bg_taken_on AS DATE), '%Y%m%d') AS INTEGER) AS ymd"
    key_columns:
      - "gl.glucose_type"
      - "gl.glucose_value"
      - "gl.glucose_unit"
      - "gl.hba1c"
      - "gl.hba1c_unit"
      - "gl.last_meal_time"
      - "gl.is_latest"
      - "gl.encounter_type"
    pattern: |
      WITH facilities AS (
          SELECT hf.id AS facility_id, hf.name AS facility_name,
                 CAST(hf.fhir_id AS BIGINT) AS organization_id,
                 co.id AS country_id, co.name AS country,
                 dis.id AS county_id, dis.name AS county_name,
                 chif.id AS subcounty_id, chif.name AS subcounty_name
          FROM health_facility_admin_gold hf
          LEFT JOIN country_admin_gold co ON hf.country_id = co.id
          LEFT JOIN district_admin_gold dis ON hf.district_id = dis.id
          LEFT JOIN chiefdom_admin_gold chif ON hf.chiefdom_id = chif.id
          WHERE hf.is_deleted = FALSE
      ),
      facility_programs AS (
          SELECT hfp.health_facility_id AS facility_id,
                 COALESCE(MAX(pg.name), 'Unassigned') AS program_name
          FROM health_facility_program_admin_gold hfp
          LEFT JOIN program_admin_gold pg ON pg.id = hfp.program_id
          GROUP BY hfp.health_facility_id
      )
      SELECT gl.*, f.facility_name, f.country, f.county_name, f.subcounty_name,
             COALESCE(fp.program_name, 'Unassigned') AS program_name
      FROM glucose_log_latest_gold gl
      LEFT JOIN facilities f ON f.organization_id = gl.organization_id
      LEFT JOIN facility_programs fp ON fp.facility_id = f.facility_id
      WHERE TRY_CAST(gl.bg_taken_on AS DATE) >= DATE '2024-10-01'
        AND TRY_CAST(gl.bg_taken_on AS DATE) <= CURRENT_DATE

  # ===========================================================================
  # Complete M&E Query Pattern
  # ===========================================================================
  full_me_pattern:
    description: "Complete M&E enrichment pattern for BP data"
    usage: "Use when M&E team needs full facility hierarchy with program assignments"
    pattern: |
      WITH facilities AS (
          SELECT hf.id AS facility_id, hf.name AS facility_name,
                 CAST(hf.fhir_id AS BIGINT) AS organization_id,
                 co.name AS country, dis.name AS county_name, chif.name AS subcounty_name
          FROM health_facility_admin_gold hf
          LEFT JOIN country_admin_gold co ON hf.country_id = co.id
          LEFT JOIN district_admin_gold dis ON hf.district_id = dis.id
          LEFT JOIN chiefdom_admin_gold chif ON hf.chiefdom_id = chif.id
          WHERE hf.is_deleted = FALSE
      ),
      facility_programs AS (
          SELECT hfp.health_facility_id AS facility_id,
                 COALESCE(MAX(pg.name), 'Unassigned') AS program_name
          FROM health_facility_program_admin_gold hfp
          LEFT JOIN program_admin_gold pg ON pg.id = hfp.program_id
          GROUP BY hfp.health_facility_id
      )
      SELECT bl.*, f.facility_name, f.country, f.county_name, f.subcounty_name,
             COALESCE(fp.program_name, 'Unassigned') AS program_name
      FROM bp_log_gold bl
      LEFT JOIN facilities f ON f.organization_id = bl.organization_id
      LEFT JOIN facility_programs fp ON fp.facility_id = f.facility_id

# =============================================================================
# Geographic Hierarchy Terminology
# =============================================================================
geographic_hierarchy:
  country_admin_gold:
    role: "Top-level geographic division (Country)"
    synonyms: ["country", "nation"]
  
  district_admin_gold:
    role: "Second-level geographic division (District/County)"
    synonyms: ["district", "county", "region"]
    note: "In some contexts called 'county' - check local terminology"
  
  chiefdom_admin_gold:
    role: "Third-level geographic division (Chiefdom/Subcounty)"
    synonyms: ["chiefdom", "subcounty", "sub-county", "ward"]
    note: "Smallest administrative unit above village level"
